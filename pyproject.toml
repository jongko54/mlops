[project]
name = "mlops-lab"
version = "0.1.0"
description = "CH1/CH2 MLOps lifecycle lab for CPU and K3s GPUs"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "torch==2.8.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.3", "pyyaml==6.0.3"]

# Local/CI environments use CPU wheels on Linux; the Docker image supplies CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
