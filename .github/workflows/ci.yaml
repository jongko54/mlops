name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.9.5
      - name: Install locked dependencies
        run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
      - name: Render both GPU overlays
        run: |
          kubectl kustomize deploy/k8s/e101 > /tmp/e101.yaml
          kubectl kustomize deploy/k8s/e102 > /tmp/e102.yaml
