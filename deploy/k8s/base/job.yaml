apiVersion: batch/v1
kind: Job
metadata:
  name: digits-train
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-digits
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: train
          # Replace with a built linux/amd64 image digest before applying.
          image: mlops-lab:build-required
          imagePullPolicy: IfNotPresent
          args:
            - --device
            - cuda
            - --output
            - /artifacts/$(POD_NAME)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OMP_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: digits-artifacts
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
